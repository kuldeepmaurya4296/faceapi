# nginx reverse proxy for the Face API (when you are not using Caddy).
#
# 1. Replace api.example.com with your domain.
# 2. certbot --nginx -d api.example.com
# 3. nginx -t && systemctl reload nginx

upstream faceapi {
    server 127.0.0.1:8000;
    keepalive 32;
}

limit_req_zone $http_x_api_key zone=faceapi_key:10m rate=120r/m;
limit_req_zone $binary_remote_addr zone=faceapi_ip:10m rate=300r/m;

server {
    listen 80;
    listen [::]:80;
    server_name api.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name api.example.com;

    ssl_certificate     /etc/letsencrypt/live/api.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    # Uploads: keep above FACEAPI_MAX_UPLOAD_MB (default 10 MB).
    client_max_body_size 50m;
    client_body_timeout 60s;

    # Edge throttling. The app enforces per-key plans as well; this just absorbs
    # crude floods before they reach Python.
    limit_req zone=faceapi_ip burst=60 nodelay;
    limit_req zone=faceapi_key burst=40 nodelay;
    limit_req_status 429;

    access_log /var/log/nginx/faceapi.access.log;
    error_log  /var/log/nginx/faceapi.error.log warn;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    server_tokens off;

    location / {
        proxy_pass http://faceapi;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";

        proxy_connect_timeout 5s;
        proxy_send_timeout    120s;
        proxy_read_timeout    120s;
        proxy_request_buffering off;
    }

    # Keep probes and metrics off the public internet.
    location = /metrics {
        allow 10.0.0.0/8;
        allow 127.0.0.1;
        deny all;
        proxy_pass http://faceapi;
    }

    location = /readyz {
        allow 10.0.0.0/8;
        allow 127.0.0.1;
        deny all;
        proxy_pass http://faceapi;
    }
}
